name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      # Roda o diagnóstico profundo de verdade numa máquina Windows para validar os coletores.
      - name: Diagnóstico (smoke test)
        shell: pwsh
        run: |
          # O .exe de release é um app de janela: Start-Process -Wait espera ele terminar.
          $p = Start-Process -FilePath ./target/release/sexta-feira.exe -ArgumentList '--diagnostico', 'diagnostico.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "diagnóstico saiu com código $($p.ExitCode)" }
          Get-Content diagnostico.json
      - uses: actions/upload-artifact@v4
        with:
          name: sexta-feira-windows
          path: |
            target/release/sexta-feira.exe
            diagnostico.json
