[package]
name = "sexta-feira"
version = "0.1.0"
edition = "2021"
description = "Assistente pessoal estilo Sexta-Feira: monitora o PC, fala e executa ações, sem pesar nos jogos"
license = "MIT"

[dependencies]
slint = "1.18"
sysinfo = "0.39"
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
directories = "6"
log = "0.4"
env_logger = "0.11"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
tray-icon = "0.26"
global-hotkey = "0.9"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
